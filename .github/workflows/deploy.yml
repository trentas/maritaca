# Deploy da maritaca na produtos-01.
#
# O compose da stack NÃO mora aqui: ele vive em sunnysystems/infra, em
# `compose/produtos-01/maritaca/docker-compose.yaml`, e é rsyncado para
# /opt/maritaca. O `.env` daquele diretório também é do infra (Infisical) e
# carrega POSTGRES_PASSWORD, AUDIT_ENCRYPTION_KEY e INTEGRATION_ENCRYPTION_KEY —
# sem as MESMAS chaves o dado cifrado no banco fica ilegível.
#
# Por isso este workflow NÃO escreve .env nem copia compose. Ele faz o que cabe
# ao repo da aplicação: publica as imagens no GHCR e, no host, troca uma linha
# (TAG=) e roda pull/migrate/up.
#
# Histórico: até 2026-08-09 este workflow gerava o .env inteiro e fazia SCP do
# docker-compose.prod.yml para `vars.SSH_HOST`, que continuou apontando para a
# sunshine-prod depois da migração da maritaca para a produtos-01 (julho/2026).
# Resultado: todo deploy desde então foi para a máquina errada. Se alguém pensar
# em ressuscitar aquele formato, lembre que ele apagava o .env do destino.

name: Deploy to production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'assets/**'

env:
  REGISTRY: ghcr.io
  # Run JavaScript actions (e.g. docker/setup-buildx-action, docker/build-push-action)
  # on Node.js 24 LTS instead of the deprecated Node.js 20 bundled runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      # fetch-tags: o checkout default é --depth=1 --no-tags, e aí o
      # `git describe` do passo abaixo não acha nada — o APP_VERSION saía vazio
      # em todo deploy disparado manualmente, deixando /version respondendo
      # null. No deploy por tag não aparecia, porque ali a versão vem do ref.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract app version from tag or latest tag
        id: app-version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/maritaca-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.app-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/maritaca-worker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.app-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Migrate
        id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/maritaca-migrate
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push Migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na produtos-01
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Tailscale por curl, não pela action: mesmo padrão do deploy-app.yml do
      # infra. timeout curto porque `tailscale up` com authkey recusada não
      # falha — fica pendurado esperando login interativo e queima o job.
      - name: Entrar na tailnet
        timeout-minutes: 3
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey "${{ secrets.TS_CI_AUTHKEY }}" \
            --hostname "ci-${{ github.repository_owner }}-${{ github.run_id }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CFG
          Host ${{ vars.DEPLOY_HOST }}
            User ${{ vars.DEPLOY_USER || 'deploy' }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      # Login transitório no GHCR: o host usa o GITHUB_TOKEN do run e faz logout
      # no trap, sem PAT persistente no servidor.
      - name: Atualizar TAG e puxar imagens
        run: |
          ssh ${{ vars.DEPLOY_HOST }} \
            GH_ACTOR="${{ github.actor }}" \
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}" \
            NEW_TAG="${{ needs.build-and-push.outputs.tag }}" \
            bash -s <<'EOS'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Só a linha do TAG. O resto do .env é do infra/Infisical e inclui as
          # chaves que cifram colunas no banco — nunca reescrever o arquivo.
          touch .env
          if grep -q '^TAG=' .env; then
            sed -i "s|^TAG=.*|TAG=${NEW_TAG}|" .env
          else
            echo "TAG=${NEW_TAG}" >> .env
          fi
          echo "TAG agora: $(grep '^TAG=' .env)"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT

          docker compose pull -q
          docker compose up -d postgres
          EOS

      # Passo separado, com o comando como ARGUMENTO do ssh e não pela stdin.
      # `docker compose run` consome a stdin, e num `bash -s <<EOS` isso engole
      # o resto do script: no primeiro deploy para a produtos-01 (run
      # 31322818906) o migrate rodou e o `up -d` seguinte simplesmente sumiu,
      # sem erro nenhum — a api e o worker ficaram na imagem antiga e o job
      # terminou verde. O `-T` e o `</dev/null` são cinto e suspensório.
      #
      # Migrations antes de subir a app, para nenhum processo novo encostar num
      # schema velho.
      - name: Migrations
        run: |
          ssh ${{ vars.DEPLOY_HOST }} \
            "cd '${{ vars.DEPLOY_PATH }}' && docker compose run --rm -T migrate" < /dev/null

      - name: Subir api e worker
        run: |
          ssh ${{ vars.DEPLOY_HOST }} \
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}" \
            bash -s <<'EOS'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          docker compose up -d --remove-orphans

          # -a é obrigatório: as tags são imutáveis, então versão velha nunca
          # vira dangling e o `prune -f` puro não remove nada — foi assim que a
          # produtos-01 chegou a 89% de disco. O filtro de 24h segura o release
          # anterior para rollback local.
          docker image prune -af --filter "until=24h" >/dev/null

          docker compose ps
          EOS

      # A stack não publica porta no host, então o health check roda de dentro
      # do container. `node -e` em vez de curl/wget: a imagem é node:26-alpine e
      # o node é a única coisa garantida ali.
      - name: Health check
        run: |
          ssh ${{ vars.DEPLOY_HOST }} \
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}" \
            bash -s <<'EOS'
          set -uo pipefail
          cd "$DEPLOY_PATH"
          for i in $(seq 1 12); do
            # </dev/null pelo mesmo motivo do migrate: exec sem isso pode comer
            # o resto do script e matar o laço de retry na primeira volta.
            if docker compose exec -T api node -e "
              fetch('http://127.0.0.1:7377/health')
                .then(async (r) => {
                  console.log(r.status, (await r.text()).slice(0, 200))
                  process.exit(r.ok ? 0 : 1)
                })
                .catch((e) => { console.log(String(e)); process.exit(1) })
            " < /dev/null; then
              echo "Health OK"
              exit 0
            fi
            sleep 10
          done
          echo "Health check FALHOU após 2 minutos"
          docker compose logs --tail 50 api
          exit 1
          EOS
